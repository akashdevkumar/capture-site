<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="img" aria-label="A pastel valley at dawn: soft pink and lavender sky, layered hills and a still lake.">
  <!-- Capture's hero artwork: a dawn valley, drawn by hand in SVG. Groups are named so the page can drift them on scroll. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfd0ec"/>
      <stop offset="0.32" stop-color="#dcd3ee"/>
      <stop offset="0.55" stop-color="#f3d0d4"/>
      <stop offset="0.72" stop-color="#fadcc4"/>
      <stop offset="0.85" stop-color="#fdeccf"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#fff1d6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffe6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8aed6"/>
      <stop offset="1" stop-color="#e3cfe3"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d29fb9"/>
      <stop offset="1" stop-color="#f2c3b4"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6b07f"/>
      <stop offset="0.5" stop-color="#c7b77c"/>
      <stop offset="1" stop-color="#a6b47e"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d9d3"/>
      <stop offset="0.5" stop-color="#e3dcef"/>
      <stop offset="1" stop-color="#cfdcf0"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c58d"/>
      <stop offset="0.45" stop-color="#94ad7a"/>
      <stop offset="1" stop-color="#6f9070"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="haze" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.45  0 0 0 0.09 0"/>
    </filter>
  </defs>

  <g id="layer-sky">
    <rect width="1600" height="900" fill="url(#sky)"/>
    <circle cx="1060" cy="540" r="300" fill="url(#sun)"/>
    <g fill="#ffffff" opacity="0.55" filter="url(#soft)">
      <ellipse cx="300" cy="230" rx="220" ry="34"/>
      <ellipse cx="520" cy="270" rx="160" ry="24"/>
      <ellipse cx="1240" cy="190" rx="260" ry="36"/>
      <ellipse cx="1420" cy="300" rx="150" ry="22"/>
      <ellipse cx="860" cy="330" rx="200" ry="20"/>
    </g>
  </g>

  <g id="layer-far" filter="url(#haze)">
    <path fill="url(#far)" d="M0 540 L 70 505 L 120 520 L 210 440 L 260 470 L 330 410 L 410 476 L 470 455 L 560 492 L 640 470 L 700 500 L 790 430 L 840 455 L 905 392 L 990 470 L 1060 488 L 1150 452 L 1210 476 L 1300 418 L 1360 446 L 1430 405 L 1520 470 L 1600 490 L 1600 900 L 0 900 Z" stroke="#c9bde0" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <g id="layer-mid">
    <path fill="url(#mid)" d="M0 620 C 120 590, 200 540, 320 556 C 430 570, 480 612, 600 600 C 700 590, 760 548, 880 560 C 1000 572, 1040 620, 1160 612 C 1270 604, 1330 562, 1450 572 C 1520 578, 1570 600, 1600 610 L 1600 900 L 0 900 Z"/>
  </g>

  <g id="layer-lake">
    <rect x="0" y="652" width="1600" height="140" fill="url(#lake)"/>
    <g stroke="#ffffff" stroke-linecap="round" opacity="0.7">
      <line x1="930" y1="672" x2="1190" y2="672" stroke-width="3"/>
      <line x1="980" y1="688" x2="1140" y2="688" stroke-width="2"/>
      <line x1="1010" y1="704" x2="1110" y2="704" stroke-width="2"/>
      <line x1="300" y1="680" x2="420" y2="680" stroke-width="1.5" opacity="0.6"/>
      <line x1="1320" y1="694" x2="1460" y2="694" stroke-width="1.5" opacity="0.6"/>
    </g>
  </g>

  <g id="layer-near">
    <path fill="url(#near)" d="M0 662 C 120 640, 250 646, 380 672 C 500 696, 620 726, 780 772 L 780 900 L 0 900 Z"/>
    <path fill="url(#near)" d="M900 776 C 1060 716, 1220 676, 1360 662 C 1460 652, 1540 664, 1600 676 L 1600 900 L 900 900 Z"/>
  </g>

  <g id="layer-meadow">
    <path fill="url(#meadow)" d="M0 742 C 160 720, 320 732, 480 750 C 640 768, 760 760, 900 744 C 1040 728, 1200 730, 1340 748 C 1450 762, 1540 760, 1600 752 L 1600 900 L 0 900 Z"/>
    <g fill="#f4a9c4">
      <circle cx="120" cy="790" r="3"/><circle cx="170" cy="812" r="2.5"/><circle cx="240" cy="784" r="2"/>
      <circle cx="330" cy="830" r="3"/><circle cx="410" cy="800" r="2"/><circle cx="520" cy="846" r="3"/>
      <circle cx="1180" cy="800" r="2.5"/><circle cx="1260" cy="828" r="3"/><circle cx="1350" cy="790" r="2"/>
      <circle cx="1440" cy="840" r="3"/><circle cx="1520" cy="806" r="2.5"/>
    </g>
    <g fill="#fff3c9">
      <circle cx="200" cy="836" r="2"/><circle cx="460" cy="818" r="2.5"/><circle cx="1220" cy="852" r="2"/><circle cx="1490" cy="824" r="2"/>
    </g>
  </g>

  <rect width="1600" height="900" filter="url(#grain)"/>
</svg>
